<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>鹤渡 · AZURE CRANE</title>
<style>
  :root{
    --ink:#3b4a47;
    --paper:#f2ece0;
    --gold:#c9a24a;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:#dfe4dc;}
  body{
    font-family:"Songti SC","STSong","SimSun","Noto Serif CJK SC",serif;
    color:var(--ink);
    user-select:none;
    cursor:pointer;
  }
  #game{display:block;width:100%;height:100%;}

  .overlay{
    position:fixed;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
    transition:opacity .7s ease;
    pointer-events:none;
  }
  .overlay.hidden{opacity:0;visibility:hidden;}

  /* ---------- Title ---------- */
  #title .title-wrap{
    display:flex;align-items:flex-start;gap:26px;
    padding:10px 0 4px;
  }
  #title .vert{
    writing-mode:vertical-rl;text-orientation:upright;
    font-family:"STKaiti","KaiTi","Kaiti SC","Songti SC",serif;
    font-size:clamp(46px,9vw,88px);
    letter-spacing:.18em;
    line-height:1;
    color:#2f3f3b;
    text-shadow:0 2px 18px rgba(255,255,255,.55);
  }
  #title .en{
    writing-mode:vertical-rl;
    font-family:Georgia,"Times New Roman",serif;
    font-size:clamp(12px,2vw,17px);
    letter-spacing:.42em;
    color:#6c7d76;
    margin-top:6px;
  }
  #title .seal{
    writing-mode:vertical-rl;
    font-family:"STKaiti","KaiTi",serif;
    font-size:13px;letter-spacing:.1em;
    color:#f6efe2;background:#b4553f;
    padding:10px 5px;border-radius:2px;
    margin-top:10px;
    box-shadow:0 1px 6px rgba(150,60,40,.3);
  }
  .subtitle{
    margin-top:26px;
    font-size:clamp(13px,2.4vw,17px);
    letter-spacing:.32em;
    color:#3a4e47;
    text-shadow:0 1px 4px rgba(255,255,255,.6);
  }
  .hint{
    margin-top:14px;
    font-size:clamp(11px,2vw,13px);
    letter-spacing:.18em;
    color:#5c6e66;
    text-shadow:0 1px 4px rgba(255,255,255,.6);
  }
  .start-btn{
    pointer-events:auto;
    margin-top:34px;
    padding:12px 40px;
    font-family:inherit;
    font-size:15px;letter-spacing:.3em;
    color:#f4efe4;
    background:rgba(47,63,59,.88);
    border:1px solid rgba(47,63,59,.9);
    border-radius:2px;
    cursor:pointer;
    transition:background .25s, transform .25s, letter-spacing .25s;
  }
  .start-btn:hover{background:#b4553f;border-color:#b4553f;letter-spacing:.4em;transform:translateY(-2px);}

  /* ---------- HUD ---------- */
  #hud{
    position:fixed;inset:0;
    pointer-events:none;
    opacity:0;transition:opacity .6s;
  }
  #hud.show{opacity:1;}
  .hud-tl{position:absolute;top:22px;left:26px;}
  .hud-tr{position:absolute;top:22px;right:26px;text-align:right;}
  .hud-label{font-size:11px;letter-spacing:.24em;color:rgba(50,66,60,.85);text-shadow:0 1px 3px rgba(255,255,255,.7);}
  .hud-score{font-family:Georgia,serif;font-size:clamp(30px,5vw,46px);line-height:1;color:#263630;text-shadow:0 1px 5px rgba(255,255,255,.85);}
  .hud-sub{font-family:Georgia,serif;font-size:15px;color:#42554e;margin-top:4px;text-shadow:0 1px 4px rgba(255,255,255,.75);}
  #combo{
    position:absolute;top:26%;left:50%;transform:translateX(-50%) scale(.8);
    font-family:Georgia,serif;font-size:clamp(20px,4vw,30px);
    color:#b4553f;letter-spacing:.1em;
    opacity:0;transition:opacity .2s, transform .35s;
  }
  #combo.pop{opacity:1;transform:translateX(-50%) scale(1.05);}
  #sound{
    position:absolute;bottom:20px;right:22px;
    pointer-events:auto;
    width:34px;height:34px;line-height:32px;text-align:center;
    font-size:16px;color:#5a6b64;
    border:1px solid rgba(90,107,100,.3);border-radius:50%;
    background:rgba(255,255,255,.22);
    cursor:pointer;transition:background .2s,color .2s;
  }
  #sound:hover{background:rgba(255,255,255,.5);}
  #sound.muted{color:#a7afa9;}

  /* ---------- Over ---------- */
  #over .panel{
    pointer-events:auto;
    min-width:min(78vw,330px);
    padding:38px 42px 34px;
    background:rgba(244,239,228,.9);
    border:1px solid rgba(90,107,100,.22);
    box-shadow:0 18px 60px rgba(40,55,50,.16);
    backdrop-filter:blur(3px);
  }
  #over .over-eyebrow{font-size:12px;letter-spacing:.35em;color:#8a9790;}
  #over .over-title{
    font-family:"STKaiti","KaiTi",serif;
    font-size:40px;letter-spacing:.2em;color:#2f3f3b;margin:8px 0 22px;
  }
  .result-row{display:flex;justify-content:space-between;align-items:baseline;padding:9px 2px;border-bottom:1px solid rgba(90,107,100,.14);}
  .result-row .k{font-size:13px;letter-spacing:.18em;color:#66766f;}
  .result-row .v{font-family:Georgia,serif;font-size:22px;color:#33433e;}
  .result-row .v.gold{color:#b4553f;}
  #over .start-btn{margin-top:28px;}

  #pauseTag{
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    font-size:20px;letter-spacing:.4em;color:#3b4a47;
    opacity:0;transition:opacity .3s;pointer-events:none;
    background:rgba(244,239,228,.7);padding:14px 30px;border-radius:2px;
  }
  #pauseTag.show{opacity:1;}

  .fade-slow{transition:opacity 1.1s ease;}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="hud-tl">
    <div class="hud-label">得分 SCORE</div>
    <div class="hud-score" id="hScore">0</div>
  </div>
  <div class="hud-tr">
    <div class="hud-label">最远 RECORD</div>
    <div class="hud-sub" id="hBest">0</div>
    <div class="hud-sub" id="hDist" style="margin-top:8px;">0 里</div>
  </div>
  <div id="combo">连 · <span id="comboN">2</span></div>
  <div id="sound" title="声音开关">♪</div>
</div>

<div id="pauseTag">止 · 息</div>

<div class="overlay" id="title">
  <div class="title-wrap">
    <div class="vert">鹤渡</div>
    <div class="en">AZURE CRANE</div>
    <div class="seal">云渡禅穹</div>
  </div>
  <div class="subtitle">御风而行 · 过千山而不留痕</div>
  <div class="hint">点击画面 / 空格 振翅高飞 · P 暂停</div>
  <button class="start-btn" id="startBtn">启 程</button>
</div>

<div class="overlay hidden" id="over">
  <div class="panel">
    <div class="over-eyebrow">此 程 已 尽</div>
    <div class="over-title">归 墟</div>
    <div class="result-row"><span class="k">本次得分</span><span class="v" id="rScore">0</span></div>
    <div class="result-row"><span class="k">飞行距离</span><span class="v" id="rDist">0 里</span></div>
    <div class="result-row"><span class="k">最高纪录</span><span class="v gold" id="rBest">0</span></div>
    <button class="start-btn" id="againBtn">再 渡</button>
  </div>
</div>

<script>
(function(){
'use strict';

/* ============================================================
   鹤渡 · AZURE CRANE
   一款零外部素材的单文件网页游戏：画面、山水、音效与配乐
   全部由代码在运行时程序化生成。
   ============================================================ */

/* ---------- 基础工具 ---------- */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const clamp = (v,a,b)=> v<a?a : v>b?b : v;
const lerp  = (a,b,t)=> a+(b-a)*t;
const rand  = (a,b)=> a+Math.random()*(b-a);
const TAU = Math.PI*2;

function hash(n){ const s=Math.sin(n*127.1+311.7)*43758.5453; return s-Math.floor(s); }
function noise1(x){
  const i=Math.floor(x), f=x-i, u=f*f*(3-2*f);
  return hash(i)*(1-u)+hash(i+1)*u;
}
function fbm(x,oct){
  oct=oct||4; let v=0,a=0.5,fr=1;
  for(let k=0;k<oct;k++){ v+=a*noise1(x*fr); fr*=2; a*=0.5; }
  return v;
}

/* ---------- 颜色 ---------- */
function hex2rgb(h){
  h=h.replace('#','');
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];
}
function mix(c1,c2,t){
  const a=hex2rgb(c1),b=hex2rgb(c2);
  return 'rgb('+Math.round(lerp(a[0],b[0],t))+','+Math.round(lerp(a[1],b[1],t))+','+Math.round(lerp(a[2],b[2],t))+')';
}
const PALETTES = [
  { key:'晨', skyTop:'#eef3ef', skyBot:'#f7f0e2', sun:'#d98b6a', glow:'#f3c8a6',
    mt:['#c2d0c9','#9db3aa','#76978c','#52796f'], cloud:'rgba(255,255,255,0.55)',
    ink:'#3b4a47', petal:'#e7b6bd', water:'#e2e9e1', star:0 },
  { key:'昼', skyTop:'#cfe0e4', skyBot:'#f3f0e3', sun:'#e6c069', glow:'#f6e3a9',
    mt:['#adc6c5','#82a6a0','#58877c','#386a5f'], cloud:'rgba(255,255,255,0.6)',
    ink:'#2f4642', petal:'#eec0c6', water:'#dbe8e4', star:0 },
  { key:'暮', skyTop:'#cbb8bd', skyBot:'#f2d7b6', sun:'#d9684c', glow:'#f0a274',
    mt:['#ad9fab','#8b8194','#6d6c84','#4f576b'], cloud:'rgba(255,232,214,0.42)',
    ink:'#3b3548', petal:'#dfa5ac', water:'#dcd0d0', star:0.12 },
  { key:'夜', skyTop:'#1b2b3a', skyBot:'#33485a', sun:'#eef3f0', glow:'#c6d6dd',
    mt:['#3c5263','#304553','#263945','#1d2d38'], cloud:'rgba(170,196,212,0.13)',
    ink:'#aebcc4', petal:'#93a6b0', water:'#293c4b', star:1 }
];
let pal = PALETTES[0];
function updatePalette(t){
  const n=PALETTES.length;
  // 先归一到 [0,1) 再放大，避免负数取模产生负索引
  const p=(((t/CYCLE)%1)+1)%1*n;
  const i=Math.floor(p), f=p-i;
  const e=f*f*(3-2*f);
  const A=PALETTES[i], B=PALETTES[(i+1)%n];
  pal={};
  ['skyTop','skyBot','sun','glow','ink','petal','water'].forEach(k=> pal[k]=mix(A[k],B[k],e));
  pal.mt=A.mt.map((c,j)=>mix(c,B.mt[j],e));
  pal.cloud=A.cloud; // 云的透明度保持简洁
  pal.star=lerp(A.star,B.star,e);
  pal.day=lerp(1,0,(i+f)/n); // 仅备用
  pal.key = e<0.5?A.key:B.key;
}
const CYCLE = 150; // 一个完整昼夜循环的秒数

/* ============================================================
   音频引擎：程序化合成配乐与音效
   ============================================================ */
const Audio = {
  ctx:null, master:null, ready:false, muted:false,
  musicT:0, noteIdx:0, melody:[0,2,4,2, 3,1,0,1, 2,4,5,4, 3,2,1,0],
  // 五声音阶（宫商角徵羽）两组八度
  scale:[261.63,293.66,329.63,392.00,440.00,523.25,587.33,659.25,783.99,880.00],
  init(){
    if(this.ready) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    this.ctx = new AC();
    const c=this.ctx;
    this.master=c.createGain(); this.master.gain.value=this.muted?0:0.55;
    this.master.connect(c.destination);
    // 空灵回声
    const delay=c.createDelay(1.0); delay.delayTime.value=0.32;
    const fb=c.createGain(); fb.gain.value=0.30;
    const wet=c.createGain(); wet.gain.value=0.22;
    this.master.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(c.destination);
    this.ready=true;
  },
  resume(){ if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); },
  env(node,t,a,d,peak){
    const g=node.gain;
    g.setValueAtTime(0.0001,t);
    g.exponentialRampToValueAtTime(peak,t+a);
    g.exponentialRampToValueAtTime(0.0001,t+a+d);
  },
  note(freq,dur,vol,type){
    if(!this.ready||this.muted) return;
    const c=this.ctx,t=c.currentTime;
    const g=c.createGain(); g.connect(this.master);
    this.env(g,t,0.012,dur,vol);
    const o1=c.createOscillator(); o1.type=type||'sine'; o1.frequency.value=freq; o1.connect(g);
    const o2=c.createOscillator(); o2.type='sine'; o2.frequency.value=freq*2.01;
    const g2=c.createGain(); g2.gain.value=0.28; o2.connect(g2); g2.connect(g);
    o1.start(t); o2.start(t); o1.stop(t+dur+0.05); o2.stop(t+dur+0.05);
  },
  music(step){
    if(!this.ready) return;
    const n=this.melody[this.noteIdx % this.melody.length];
    this.noteIdx++;
    if(Math.random()<0.16) return; // 偶尔留白
    const oct = (step%8<4)?0:1;
    this.note(this.scale[n+oct], rand(0.9,1.5), rand(0.05,0.085), 'sine');
  },
  flap(){
    if(!this.ready||this.muted) return;
    const c=this.ctx,t=c.currentTime;
    const g=c.createGain(); g.connect(this.master);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.10,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
    const o=c.createOscillator(); o.type='triangle';
    o.frequency.setValueAtTime(520,t);
    o.frequency.exponentialRampToValueAtTime(180,t+0.15);
    const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=760; f.Q.value=0.8;
    o.connect(f); f.connect(g); o.start(t); o.stop(t+0.18);
  },
  collect(combo){
    if(!this.ready||this.muted) return;
    const base=880*Math.pow(1.0595,Math.min(combo,10)*2);
    this.note(base,0.22,0.10,'sine');
    this.note(base*1.5,0.16,0.05,'triangle');
  },
  gate(){
    if(!this.ready||this.muted) return;
    this.note(523.25,0.9,0.10,'sine');
    this.note(783.99,1.1,0.06,'sine');
  },
  hit(){
    if(!this.ready||this.muted) return;
    const c=this.ctx,t=c.currentTime;
    const g=c.createGain(); g.connect(this.master);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.28,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.6);
    const o=c.createOscillator(); o.type='sawtooth';
    o.frequency.setValueAtTime(160,t);
    o.frequency.exponentialRampToValueAtTime(42,t+0.5);
    const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=400;
    o.connect(f); f.connect(g); o.start(t); o.stop(t+0.62);
  },
  toggle(){
    this.muted=!this.muted;
    if(this.master) this.master.gain.value=this.muted?0:0.55;
    return this.muted;
  }
};

/* ============================================================
   游戏状态与实体
   ============================================================ */
const STATE = { TITLE:0, PLAY:1, OVER:2 };
let state = STATE.TITLE;
let paused = false;

const crane = {
  x:0,y:0,vy:0,r:11, wing:0, wingPhase:0, pitch:0, dead:false, deadVy:0, spin:0
};
let ports=[], motes=[], particles=[], petals=[];
let speed=0, distance=0, score=0, best=0, combo=0, comboTimer=0;
let elapsed=0, spawnX=0, bgOffset=0, shake=0, flash=0;
let musicClock=0;

try{ best=parseInt(localStorage.getItem('azureCraneBest')||'0',10)||0; }catch(e){ best=0; }

function difficulty(){ return clamp(distance/7000,0,1); }

function makeGap(){
  const d=difficulty();
  const gapH=clamp(lerp(H*0.36,H*0.235,d),H*0.2,999);
  const margin=gapH*0.5+28;
  const minY=Math.max(H*0.26,margin);
  const maxY=Math.min(H*0.74,H-margin);
  const gapY=rand(minY,maxY<minY?minY:maxY);
  return {gapY,gapH};
}

function spawnPort(){
  const w=rand(150,215);
  const {gapY,gapH}=makeGap();
  ports.push({ x:spawnX, w, gapY, gapH, passed:false, seed:rand(0,100) });
  // 在缝隙中撒一串灵气光点
  const count=Math.floor(rand(3,6));
  const startX=spawnX - rand(60,120);
  for(let i=0;i<count;i++){
    motes.push({
      x:startX+i*rand(26,34),
      y:gapY+Math.sin(i*0.9+ports[ports.length-1].seed)*gapH*0.22,
      r:5, taken:false, phase:rand(0,TAU)
    });
  }
  spawnX += w + lerp(330,235,difficulty()) + rand(-20,30);
}

function burst(x,y,color,n,spd){
  for(let i=0;i<n;i++){
    const a=rand(0,TAU),s=rand(spd*0.3,spd);
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,decay:rand(1.1,2.2),r:rand(1.5,4),color});
  }
}
function initPetals(){
  petals=[];
  for(let i=0;i<26;i++){
    petals.push({x:rand(0,W),y:rand(0,H),s:rand(2.2,4.6),vy:rand(9,20),phase:rand(0,TAU),sw:rand(0.6,1.4)});
  }
}

function reset(){
  ports=[];motes=[];particles=[];initPetals();
  distance=0;score=0;combo=0;comboTimer=0;elapsed=0;shake=0;flash=0;musicClock=0;
  bgOffset=0;
  speed=lerp(190,300,difficulty());
  crane.x=W*0.24;crane.y=H*0.5;crane.vy=0;crane.dead=false;crane.deadVy=0;crane.spin=0;
  spawnX=W*0.75;
  spawnPort();spawnPort();spawnPort();
}

/* ============================================================
   输入
   ============================================================ */
function flap(){
  if(state===STATE.TITLE){ startGame(); return; }
  if(state===STATE.OVER) return;
  if(paused) return;
  crane.vy = -lerp(300,340,difficulty());
  crane.wingPhase=0;
  Audio.flap();
  burst(crane.x-14,crane.y+4,pal.ink,4,30);
}
function startGame(){
  Audio.init();Audio.resume();
  reset();
  state=STATE.PLAY;
  document.getElementById('title').classList.add('hidden');
  document.getElementById('over').classList.add('hidden');
  document.getElementById('hud').classList.add('show');
}
function restart(){ startGame(); }

window.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){ e.preventDefault(); flap(); }
  if(e.code==='KeyP'||e.code==='Escape'){
    if(state===STATE.PLAY){ paused=!paused; document.getElementById('pauseTag').classList.toggle('show',paused); }
  }
});
canvas.addEventListener('pointerdown',e=>{ e.preventDefault(); flap(); });
document.getElementById('startBtn').addEventListener('click',e=>{e.stopPropagation();startGame();});
document.getElementById('againBtn').addEventListener('click',e=>{e.stopPropagation();restart();});
document.getElementById('sound').addEventListener('click',e=>{
  e.stopPropagation();
  const m=Audio.toggle();
  e.currentTarget.classList.toggle('muted',m);
  e.currentTarget.textContent=m?'×':'♪';
});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden && state===STATE.PLAY && !paused){ paused=true;document.getElementById('pauseTag').classList.add('show'); }
});

/* ============================================================
   更新
   ============================================================ */
function die(){
  crane.dead=true;crane.deadVy=crane.vy;
  shake=16;flash=0.55;
  Audio.hit();
  burst(crane.x,crane.y,pal.ink,26,180);
  burst(crane.x,crane.y,'#b4553f',10,140);
  setTimeout(()=>{
    state=STATE.OVER;
    document.getElementById('hud').classList.remove('show');
    const dist=Math.floor(distance/40);
    document.getElementById('rScore').textContent=score;
    document.getElementById('rDist').textContent=dist+' 里';
    document.getElementById('rBest').textContent=best;
    document.getElementById('over').classList.remove('hidden');
  },900);
}

function update(dt){
  // 环境时间始终推进，让标题界面也有昼夜流动
  elapsed+=dt;
  updatePalette(elapsed);

  if(state===STATE.TITLE){
    crane.y=H*0.5+Math.sin(elapsed*1.4)*10;
    crane.wingPhase+=dt*4.5;
    crane.wing=Math.sin(crane.wingPhase);
    crane.pitch=Math.sin(elapsed*0.8)*0.06;
    updatePetals(dt);
    return;
  }
  if(state===STATE.OVER || paused){
    if(state===STATE.OVER && crane.dead){
      crane.deadVy+=900*dt;crane.y+=crane.deadVy*dt;crane.spin+=dt*3.2;
    }
    updateParticles(dt);
    return;
  }

  // --- 飞行物理 ---
  const d=difficulty();
  speed=lerp(190,300,d);
  const g=lerp(760,840,d);
  crane.vy+=g*dt;
  crane.vy=clamp(crane.vy,-360,470);
  crane.y+=crane.vy*dt;
  crane.pitch=lerp(crane.pitch,clamp(crane.vy/620,-0.45,0.62),dt*7);
  crane.wingPhase+=dt*(crane.vy<0?16:7);
  crane.wing=Math.sin(crane.wingPhase);
  distance+=speed*dt;
  bgOffset+=speed*dt;
  spawnX-=speed*dt;

  // 边界
  const top=8, bottom=H-6;
  if(crane.y<top){crane.y=top;crane.vy=Math.max(crane.vy,40);}
  if(crane.y>bottom){crane.y=bottom;crane.vy=Math.min(crane.vy,-40);}

  // --- 生成 ---
  const lastPort=ports[ports.length-1];
  if(!lastPort || lastPort.x+lastPort.w < W+90) spawnPort();

  // --- 门与碰撞 ---
  const cx=crane.x, r=crane.r;
  for(let i=ports.length-1;i>=0;i--){
    const p=ports[i];
    if(cx+r>p.x && cx-r<p.x+p.w){
      const topEdge=p.gapY-p.gapH*0.5;
      const botEdge=p.gapY+p.gapH*0.5;
      if(crane.y-r*0.72<topEdge || crane.y+r*0.72>botEdge){ die(); }
    }
    if(!p.passed && cx>p.x+p.w){
      p.passed=true;score+=10;Audio.gate();
      burst(p.x+p.w,p.gapY,'#b4553f',8,70);
    }
    if(p.x+p.w < -40) ports.splice(i,1);
  }

  // --- 灵气收集 ---
  for(let i=motes.length-1;i>=0;i--){
    const m=motes[i];
    m.x-=speed*dt;
    m.phase+=dt*3;
    const dx=m.x-cx, dy=m.y-crane.y;
    if(!m.taken && dx*dx+dy*dy < (m.r+r+8)*(m.r+r+8)){
      m.taken=true;
      combo++;comboTimer=2.2;
      score+=5*Math.max(1,combo);
      Audio.collect(combo);
      burst(m.x,m.y,'#e8c15c',12,90);
      if(combo>=2){
        const c=document.getElementById('combo');
        document.getElementById('comboN').textContent=combo;
        c.classList.add('pop');
        clearTimeout(c._t);
        c._t=setTimeout(()=>c.classList.remove('pop'),700);
      }
    }
    if(m.x<-30) motes.splice(i,1);
  }
  if(comboTimer>0){comboTimer-=dt;if(comboTimer<=0)combo=0;}

  // --- 音乐调度 ---
  musicClock+=dt;
  const beat=0.62;
  if(musicClock>=beat){musicClock-=beat;Audio.music(Math.floor(elapsed/beat));}

  updateParticles(dt);
  updatePetals(dt);
  if(shake>0)shake=Math.max(0,shake-dt*32);
  if(flash>0)flash=Math.max(0,flash-dt*1.6);

  // HUD
  document.getElementById('hScore').textContent=score;
  document.getElementById('hBest').textContent=Math.max(best,score);
  document.getElementById('hDist').textContent=Math.floor(distance/40)+' 里';
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=60*dt;p.vx*=0.98;
    p.life-=p.decay*dt;
    if(p.life<=0)particles.splice(i,1);
  }
}
function updatePetals(dt){
  for(const q of petals){
    q.phase+=dt*q.sw;
    q.x+=(Math.sin(q.phase)*14 - speed*0.12)*dt;
    q.y+=q.vy*dt;
    if(q.y>H+10){q.y=-10;q.x=rand(0,W);}
    if(q.x<-10)q.x=W+10;
  }
}

/* ============================================================
   绘制
   ============================================================ */
function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,pal.skyTop);g.addColorStop(1,pal.skyBot);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // 星星
  if(pal.star>0.02){
    ctx.save();ctx.globalAlpha=pal.star;
    for(let i=0;i<70;i++){
      const x=(hash(i*3.1)*W + bgOffset*0.02*(i%3+1))%W;
      const y=hash(i*7.7)*H*0.62;
      const tw=0.5+0.5*Math.sin(elapsed*2+i);
      ctx.fillStyle='rgba(240,244,240,'+(0.35+tw*0.5)+')';
      ctx.fillRect(x,y,1.4,1.4);
    }
    ctx.restore();
  }
  // 日月
  const sx=W*0.78, sy=H*0.2;
  ctx.save();
  const glow=ctx.createRadialGradient(sx,sy,4,sx,sy,H*0.26);
  glow.addColorStop(0,pal.glow);glow.addColorStop(1,'rgba(255,255,255,0)');
  ctx.globalAlpha=0.55;ctx.fillStyle=glow;
  ctx.beginPath();ctx.arc(sx,sy,H*0.26,0,TAU);ctx.fill();
  ctx.globalAlpha=0.92;ctx.fillStyle=pal.sun;
  ctx.beginPath();ctx.arc(sx,sy,Math.min(W,H)*0.052,0,TAU);ctx.fill();
  ctx.restore();
}

function drawMountains(){
  // 四层远山，越远越淡、视差越慢
  const layers=4;
  for(let L=0;L<layers;L++){
    const par=(0.06+L*0.10);
    const off=bgOffset*par;
    const baseY=H*(0.56+L*0.13);
    const amp=H*(0.20-L*0.028);
    const freq=0.0016+L*0.0007;
    const seed=L*37.3;
    ctx.beginPath();
    ctx.moveTo(0,H);
    for(let x=0;x<=W+8;x+=8){
      const wx=x+off;
      const ridge=fbm(wx*freq+seed,4);
      const detail=noise1(wx*freq*5+seed)*amp*0.10;
      const y=baseY-(ridge*amp+detail);
      ctx.lineTo(x,y);
    }
    ctx.lineTo(W,H);ctx.closePath();
    ctx.fillStyle=pal.mt[L];
    ctx.globalAlpha=lerp(0.5,0.95,L/3);
    ctx.fill();
    ctx.globalAlpha=1;
  }
}

function drawClouds(){
  ctx.save();
  ctx.fillStyle=pal.cloud;
  for(let i=0;i<6;i++){
    const span=W*0.42;
    let x=((i*W*0.31 - bgOffset*0.16)%(W+span*2)+(W+span*2))%(W+span*2)-span;
    const y=H*(0.30+hash(i*2.2)*0.34);
    const w=span*randFixed(i)*1.1, h=H*0.05;
    ctx.beginPath();
    ctx.ellipse(x,y,w,h,0,0,TAU);
    ctx.ellipse(x+w*0.4,y-h*0.3,w*0.6,h*0.8,0,0,TAU);
    ctx.fill();
  }
  ctx.restore();
}
function randFixed(i){ return 0.5+hash(i*9.9)*0.7; }

function drawGate(p){
  const topEdge=p.gapY-p.gapH*0.5;
  const botEdge=p.gapY+p.gapH*0.5;
  const x=p.x,w=p.w;
  // 上山（倒挂的崖）
  drawCliff(x,w,0,topEdge,p.seed,true);
  // 下山
  drawCliff(x,w,botEdge,H,p.seed+5,false);
  // 缝隙间淡淡的水墨横纹
  ctx.save();
  ctx.globalAlpha=0.10;ctx.strokeStyle=pal.ink;ctx.lineWidth=1;
  for(let k=0;k<3;k++){
    const y=p.gapY + (k-1)*p.gapH*0.28;
    ctx.beginPath();ctx.moveTo(x+8,y);ctx.lineTo(x+w-8,y+Math.sin(k+p.seed)*3);ctx.stroke();
  }
  ctx.restore();
}
function drawCliff(x,w,y0,y1,seed,isTop){
  if(y1<=y0) return;
  const h=y1-y0;
  // 主体渐变
  const g=ctx.createLinearGradient(x,0,x+w,0);
  g.addColorStop(0,pal.mt[3]);g.addColorStop(0.5,pal.mt[2]);g.addColorStop(1,pal.mt[3]);
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(x,y0);ctx.lineTo(x+w,y0);ctx.lineTo(x+w,y1);ctx.lineTo(x,y1);ctx.closePath();
  ctx.fillStyle=g;ctx.fill();

  // 朝向缝隙的边缘做成起伏的岩石/山脊
  const edgeY=isTop?y1:y0;
  const dir=isTop?-1:1;
  ctx.beginPath();
  if(isTop){ctx.moveTo(x,y0);ctx.lineTo(x+w,y0);ctx.lineTo(x+w,edgeY);}
  else{ctx.moveTo(x,y1);ctx.lineTo(x+w,y1);ctx.lineTo(x+w,edgeY);}
  for(let sx=w;sx>=0;sx-=10){
    const n=fbm((x+sx)*0.03+seed,3);
    // 山脊只朝各自的外侧起伏，保证缝隙的视觉宽度不小于碰撞判定，杜绝“冤死”
    const spike=Math.abs((n-0.5)*h*0.22 + Math.sin((x+sx)*0.08+seed)*h*0.05);
    ctx.lineTo(x+sx,edgeY+dir*spike);
  }
  ctx.closePath();
  ctx.fillStyle=isTop?pal.mt[2]:pal.mt[3];
  ctx.fill();

  // 皴法：几道竖向墨线
  ctx.globalAlpha=0.20;ctx.strokeStyle=pal.ink;ctx.lineWidth=1;
  for(let i=1;i<=4;i++){
    const lx=x+w*(i/5);
    ctx.beginPath();
    ctx.moveTo(lx,y0+h*0.08);
    ctx.bezierCurveTo(lx+6,y0+h*0.35,lx-8,y0+h*0.6,lx+3,y1-h*0.06);
    ctx.stroke();
  }
  // 缝隙口沿的云雾：让坚硬的崖壁与柔和背景自然过渡
  ctx.globalAlpha=1;
  const fog=ctx.createLinearGradient(0,edgeY-dir*h*0.16,0,edgeY+dir*h*0.06);
  fog.addColorStop(0,'rgba(255,255,255,0)');
  fog.addColorStop(1,(pal.star>0.5?'rgba(200,214,221,0.5)':'rgba(255,255,255,0.62)'));
  ctx.fillStyle=fog;
  const fy0=isTop?edgeY-h*0.16:edgeY;
  ctx.fillRect(x-6,fy0,w+12,h*0.22);
  ctx.restore();
}

function drawMotes(){
  for(const m of motes){
    if(m.taken)continue;
    const pulse=0.8+0.2*Math.sin(m.phase);
    const r=m.r*pulse;
    ctx.save();
    const g=ctx.createRadialGradient(m.x,m.y,0,m.x,m.y,r*4);
    g.addColorStop(0,'rgba(255,238,170,0.95)');
    g.addColorStop(0.25,'rgba(232,193,92,0.7)');
    g.addColorStop(1,'rgba(232,193,92,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(m.x,m.y,r*4,0,TAU);ctx.fill();
    ctx.fillStyle='rgba(255,250,225,0.95)';ctx.beginPath();ctx.arc(m.x,m.y,r*0.55,0,TAU);ctx.fill();
    ctx.restore();
  }
}

function drawWing(bx,by,ang,color,edge){
  ctx.save();ctx.translate(bx,by);ctx.rotate(ang);
  ctx.fillStyle=color;ctx.strokeStyle=edge;ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.quadraticCurveTo(-5,-24,-20,-33);
  ctx.quadraticCurveTo(-29,-37,-25,-27);
  ctx.quadraticCurveTo(-15,-13,-2,-1);
  ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(32,40,38,0.86)';
  ctx.beginPath();
  ctx.moveTo(-20,-33);ctx.quadraticCurveTo(-29,-37,-25,-27);
  ctx.quadraticCurveTo(-22,-29,-17,-23);ctx.closePath();ctx.fill();
  ctx.restore();
}
function drawCrane(){
  ctx.save();
  ctx.translate(crane.x,crane.y);
  const deadSpin=crane.dead?crane.spin:0;
  ctx.rotate((crane.dead?0.3:crane.pitch)+deadSpin);
  const s=1;
  ctx.scale(s,s);
  // 身体
  ctx.fillStyle='#fbfaf4';ctx.strokeStyle='rgba(45,55,52,0.45)';ctx.lineWidth=1;
  ctx.beginPath();ctx.ellipse(0,0,21,8.5,0,0,TAU);ctx.fill();ctx.stroke();
  // 颈与头（向右前方）
  ctx.beginPath();
  ctx.moveTo(13,-3);ctx.quadraticCurveTo(32,-9,39,-15);
  ctx.lineTo(43,-14);ctx.quadraticCurveTo(38,-5,18,2);ctx.closePath();
  ctx.fillStyle='#fbfaf4';ctx.fill();
  ctx.beginPath();ctx.ellipse(41,-15,4.6,3.8,0,0,TAU);ctx.fill();
  // 丹顶
  ctx.fillStyle='#c0392b';ctx.beginPath();ctx.ellipse(42,-18.2,2.8,1.7,0,0,TAU);ctx.fill();
  // 喙
  ctx.fillStyle='#2c3331';ctx.beginPath();ctx.moveTo(45,-15);ctx.lineTo(57,-13.4);ctx.lineTo(45,-11);ctx.closePath();ctx.fill();
  // 尾羽
  ctx.beginPath();ctx.moveTo(-17,-2);ctx.lineTo(-33,-6);ctx.lineTo(-29,0);ctx.lineTo(-33,4);ctx.lineTo(-17,3);ctx.closePath();ctx.fill();
  // 腿（收起后伸）
  ctx.strokeStyle='#2c3331';ctx.lineWidth=1.3;
  ctx.beginPath();ctx.moveTo(-6,6);ctx.lineTo(-20,12);ctx.moveTo(-2,7);ctx.lineTo(-15,14);ctx.stroke();
  // 远翼
  drawWing(-3,-2,-crane.wing*0.55-0.18,'#e6e8e1','rgba(45,55,52,0.35)');
  // 近翼
  drawWing(2,-1,crane.wing*0.95,'#ffffff','rgba(45,55,52,0.6)');
  ctx.restore();
}

function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha=clamp(p.life,0,1);
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill();
  }
  ctx.globalAlpha=1;
}
function drawPetals(){
  for(const q of petals){
    ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.phase);
    ctx.globalAlpha=0.7;ctx.fillStyle=pal.petal;
    ctx.beginPath();ctx.ellipse(0,0,q.s,q.s*0.55,0,0,TAU);ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha=1;
}
function drawForeground(){
  // 底部水雾
  const g=ctx.createLinearGradient(0,H*0.86,0,H);
  g.addColorStop(0,'rgba(255,255,255,0)');
  g.addColorStop(1,pal.water);
  ctx.fillStyle=g;ctx.fillRect(0,H*0.86,W,H*0.14);
  // 水面横纹
  ctx.save();ctx.globalAlpha=0.18;ctx.strokeStyle=pal.ink;ctx.lineWidth=1;
  for(let i=0;i<4;i++){
    const y=H*(0.90+i*0.026);
    let x0=((-bgOffset*0.4+i*140)%160)-160;
    ctx.beginPath();
    for(let x=x0;x<W;x+=160){ctx.moveTo(x,y);ctx.lineTo(x+70,y);}
    ctx.stroke();
  }
  ctx.restore();
}

function render(){
  ctx.save();
  if(shake>0){ ctx.translate(rand(-shake,shake),rand(-shake,shake)); }
  drawSky();
  drawMountains();
  drawClouds();
  drawPetals();
  for(const p of ports) drawGate(p);
  drawMotes();
  drawCrane();
  drawParticles();
  drawForeground();
  ctx.restore();
  if(flash>0){ ctx.fillStyle='rgba(255,250,240,'+flash*0.6+')';ctx.fillRect(0,0,W,H); }
  // 四角暗角，聚焦留白
  const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.75);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(30,40,36,0.10)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}

/* ============================================================
   主循环
   ============================================================ */
let last=performance.now();
function loop(now){
  let dt=(now-last)/1000;last=now;
  if(dt<0)dt=0;
  if(dt>0.05)dt=0.05;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
initPetals();
updatePalette(0);
requestAnimationFrame(loop);

})();
</script>
</body>
